<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <span class="round">Round</span>
        
        <span class="scoreboard">
            <span class="score-container">Player:
                <span class="score human-score">0</span>
            </span>
            <span class="score-container">Ties:
                <span class="score ties">0</span>
            </span>
            <span class="score-container">Computer:
                <span class="score computer-score">0</span>
            </span>
        </span>
        
        <span class="choice-container">
            <button class="choice rock" title="rock">&#129704;</button>
            <button class="choice paper" title="paper">&#128196;</button>
            <button class="choice scissor" title="scissor">&#9986;</button>
        </span>

        <span class="game-message">Click to play!</span>
        <span class="game-result"></span>

    </div>
</body>
</html>
